[project]
name = "lau-meme-pipeline"
version = "0.1.0"
description = "Batch pipeline (crawl → process → publish) for lau-meme"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lau_meme_pipeline"]

# Lint/test/coverage rules: the dk guard blocks agents from loosening [tool.ruff|pytest|coverage|mypy].
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text is full of "ambiguous" unicode by design

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
