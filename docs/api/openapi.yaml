openapi: 3.1.0
info:
  title: lau-meme API
  version: 0.1.0
servers:
  - url: /api
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Trạng thái Worker và schema D1
      x-ac: [AC-HEALTH-01]
      responses:
        '200':
          description: Hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                required: [status, env, schema]
                properties:
                  status: { type: string, enum: [ok] }
                  env: { type: string }
                  schema: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Lỗi theo RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
