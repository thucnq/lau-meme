openapi: 3.1.0
info:
  title: lau-meme API
  version: 0.3.0
  description: |
    API của Worker Lẩu Meme. Bốn chủ thể (BRD mục 2): thực khách ẩn danh (header `X-Player-Id` = UUID v4
    sinh trên trình duyệt), thực khách đã đăng nhập Google (cookie phiên `laumeme_sid`, ADR 0010 - kết quả Daily,
    streak và nickname trên bảng xếp hạng thuộc tài khoản), quản trị (`Authorization: Bearer <ADMIN_TOKEN>`), pipeline
    (`Authorization: Bearer <PIPELINE_TOKEN>`). Mọi lỗi là `application/problem+json` (RFC 9457), `title`
    tiếng Việt. Mọi endpoint ghi của thực khách cần bản ghi đồng ý mục đích `play` cho version chính sách
    hiện hành (AC-PRIV-02/09) - thiếu thì 403; và bị giới hạn tần suất theo UUID và IP băm - vượt thì 429
    kèm `Retry-After`. Định danh phần tử/công thức là băm (ADR 0002), không bao giờ là tên đọc được.
servers:
  - url: /lau-meme/api
    description: Tiền tố đường dẫn con (`base-path.json`, ADR 0007) - production https://dinoduct.fun/lau-meme/api, staging https://staging.dinoduct.fun/lau-meme/api
security: []
tags:
  - name: content
    description: Manifest, graph, danh sách chặn (GRAPH, REPORT)
  - name: player
    description: Đồng ý, nickname, dữ liệu của tôi (PRIV, DISC)
  - name: auth
    description: Đăng nhập Google, phiên, đăng xuất (AUTH, ADR 0010)
  - name: play
    description: Khám phá, Daily, báo cáo, phiếu, sự kiện
  - name: admin
    description: Trang quản trị (ADMIN) - chỉ phục vụ trên host quản trị riêng (ADR 0008)
  - name: pipeline
    description: Mẻ nhúng đăng nội dung, rollback, số liệu (PIPE, GRAPH, METRIC)
paths:
  /health:
    get:
      operationId: getHealth
      tags: [content]
      summary: Trạng thái Worker và schema D1
      security: []
      x-ac: [AC-HEALTH-01]
      responses:
        '200':
          description: Hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                required: [status, env, schema]
                properties:
                  status: { type: string, enum: [ok] }
                  env: { type: string }
                  schema: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- content
  /manifest:
    get:
      operationId: getManifest
      tags: [content]
      summary: Manifest của version hiện hành
      description: '`Cache-Control: public, max-age=60`. Chưa có mẻ nào thì 503.'
      security: []
      x-ac: [AC-GRAPH-04, AC-GRAPH-06, AC-GRAPH-08, AC-DAILY-03, AC-DAILY-12, AC-GAME-17, AC-PRIV-09]
      responses:
        '200':
          description: Manifest hiện hành
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheShort' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /graph/{version}:
    get:
      operationId: getGraph
      tags: [content]
      summary: Graph mã hóa của một version (bất biến)
      description: '`Cache-Control: public, max-age=31536000, immutable`; Worker đặt vào Cache API.'
      security: []
      x-ac: [AC-GRAPH-01, AC-GRAPH-02, AC-GRAPH-03, AC-GRAPH-04, AC-GAME-14]
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Graph
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheImmutable' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Graph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /blocklist:
    get:
      operationId: getBlocklist
      tags: [content]
      summary: Danh sách chặn nóng (phần tử, công thức, ảnh)
      description: '`Cache-Control: public, max-age=60`; `?fresh=1` bỏ qua cache (AC-REPORT-04).'
      security: []
      x-ac: [AC-REPORT-04, AC-REPORT-05, AC-REPORT-06, AC-REPORT-07, AC-GAME-15, AC-ADMIN-03, AC-ADMIN-04, AC-ART-07]
      parameters:
        - name: fresh
          in: query
          required: false
          schema: { type: integer, enum: [1] }
      responses:
        '200':
          description: Danh sách chặn
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheShort' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blocklist' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- player
  /consents:
    post:
      operationId: createConsent
      tags: [player]
      summary: Ghi đồng ý hoặc rút đồng ý (append-only)
      description: Không cần đồng ý trước (đây là nơi tạo đồng ý). Lưu IP băm, kênh "web".
      security: [{ PlayerId: [] }]
      x-ac: [AC-PRIV-02, AC-PRIV-03, AC-PRIV-04, AC-PRIV-06, AC-PRIV-09]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '201':
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      summary: Đăng nhập bằng ID token của Google Identity Services
      description: |
        Kiểm chữ ký ID token theo JWKS của Google (cache 10 phút trong isolate, `kid` lạ thì tải lại), `iss` là
        `accounts.google.com` hoặc `https://accounts.google.com`, `aud` = `GOOGLE_CLIENT_ID`, `exp` chưa qua (lệch
        đồng hồ cho phép 60 s). Hợp lệ thì tìm/tạo tài khoản theo HMAC-SHA256(`ACCOUNT_HASH_KEY`, `sub`), gắn UUID
        `X-Player-Id` vào tài khoản (UUID đang gắn tài khoản khác thì chuyển sang tài khoản này), mở phiên mới và
        đặt cookie `laumeme_sid` (`HttpOnly; Secure; SameSite=Lax; Path=/lau-meme; Max-Age=7776000`). Cần đồng ý
        mục đích `play` của UUID (thiếu → 403). Mọi lỗi của token (thiếu, sai định dạng, sai chữ ký/`aud`/`iss`,
        hết hạn, JWKS không tải được) → 401, không tạo tài khoản, không mở phiên; token và `sub` không vào log.
        Giới hạn 10 yêu cầu/phút theo IP băm (AC-AUTH-07).
      security: [{ PlayerId: [] }]
      x-ac: [AC-AUTH-01, AC-AUTH-03, AC-AUTH-04, AC-AUTH-07, AC-PRIV-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInRequest' }
      responses:
        '200':
          description: Đã đăng nhập; tài khoản mới hoặc có sẵn
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Phiên hiện tại (sau khi tải lại trang)
      description: Phiên hợp lệ thì gia hạn (90 ngày kể từ lần dùng này) và đặt lại cookie; không có hoặc hết hạn → 401.
      security: [{ Session: [] }]
      x-ac: [AC-AUTH-02, AC-AUTH-04]
      responses:
        '200':
          description: Đang đăng nhập
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: signOut
      tags: [auth]
      summary: Đăng xuất (idempotent)
      description: Xóa phiên trong D1 (cookie cũ dùng lại → 401) và trả cookie `laumeme_sid` rỗng `Max-Age=0`. Không có phiên vẫn 204.
      security: [{}, { Session: [] }]
      x-ac: [AC-AUTH-05]
      responses:
        '204':
          description: Đã đăng xuất
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSessionCookie' }
        default: { $ref: '#/components/responses/Problem' }
  /me:
    get:
      operationId: getMyData
      tags: [player]
      summary: Xem / xuất dữ liệu của tôi
      description: |
        UUID chưa có dữ liệu trả cấu trúc rỗng, không bao giờ dữ liệu của người khác. Không cần đồng ý. Có phiên hợp
        lệ thì thêm `account` (thời điểm tạo, số phiên đang mở, nickname, kết quả Daily và streak của tài khoản);
        không bao giờ có băm `sub` (AC-AUTH-06).
      security: [{ PlayerId: [] }, { PlayerId: [], Session: [] }]
      x-ac: [AC-PRIV-08, AC-AUTH-06]
      responses:
        '200':
          description: Dữ liệu của UUID gửi lên
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMyData
      tags: [player]
      summary: Xóa dữ liệu của tôi (idempotent)
      description: |
        Xóa nickname, kết quả Daily, streak, phiếu, sự kiện; khám phá và báo cáo giữ nhưng bỏ UUID; đồng ý giữ
        và thêm dòng `erase` (xóa hẳn sau 1 năm). Không cần đồng ý. UUID được bỏ gắn khỏi tài khoản.
        Có phiên hợp lệ thì xóa luôn tài khoản: băm `sub`, mọi phiên, nickname, kết quả Daily, streak; mọi UUID
        đã gắn tài khoản được xóa như trên; cookie bị xóa. Đăng nhập lại bằng cùng Google tạo tài khoản mới trống.
      security: [{ PlayerId: [] }, { PlayerId: [], Session: [] }]
      x-ac: [AC-PRIV-05, AC-AUTH-06]
      responses:
        '204':
          description: Đã xóa (hoặc không có gì để xóa)
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSessionCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Problem' }
  /me/nickname:
    put:
      operationId: putNickname
      tags: [player]
      summary: Đặt / đổi nickname
      description: |
        Cần đồng ý mục đích `nickname` của UUID (thiếu → 403). Lọc từ cấm + bí danh trên dạng `fold`. Có phiên hợp
        lệ thì đặt nickname của **tài khoản** (hiện trên bảng xếp hạng, mọi máy đã đăng nhập - AC-AUTH-04), không thì
        của UUID (Công thức gia truyền). Trùng (409) khi `fold` đã thuộc tài khoản khác hoặc UUID không gắn tài
        khoản này.
      security: [{ PlayerId: [] }, { PlayerId: [], Session: [] }]
      x-ac: [AC-DISC-02, AC-DISC-03, AC-DISC-04, AC-DISC-12, AC-PRIV-03, AC-MOD-06, AC-ADMIN-05, AC-AUTH-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NicknameRequest' }
      responses:
        '200':
          description: Nickname đã lưu (đã cắt khoảng trắng)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nickname]
                properties:
                  nickname: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Problem' }
  /me/streak:
    get:
      operationId: getMyStreak
      tags: [player]
      summary: Streak của tài khoản đang đăng nhập
      description: Cần phiên hợp lệ trong mọi trường hợp (chỉ có `X-Player-Id` cũng là 401). Mọi máy đã đăng nhập cùng tài khoản thấy cùng streak.
      security: [{ Session: [] }]
      x-ac: [AC-DAILY-10, AC-AUTH-02, AC-AUTH-04]
      responses:
        '200':
          description: Streak hiện tại (0 nếu đã đứt) và dài nhất
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Streak' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- play
  /discoveries:
    get:
      operationId: listDiscoveries
      tags: [play]
      summary: Công thức gia truyền của các phần tử
      description: 'Không chứa UUID, không chứa công thức đã dùng. `Cache-Control: public, max-age=60`.'
      security: []
      x-ac: [AC-DISC-09, AC-PRIV-05]
      parameters:
        - name: ids
          in: query
          required: true
          description: Tối đa 50 id phần tử, cách nhau bằng dấu phẩy
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { $ref: '#/components/schemas/ElementId' }
      responses:
        '200':
          description: Chỉ có các phần tử đã được khám phá
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheShort' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Discovery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDiscovery
      tags: [play]
      summary: Gửi khám phá (ghi người đầu tiên)
      description: |
        Server kiểm A + B = result là công thức đang hoạt động ở version hiện hành (không bị chặn), result không
        phải phần tử khởi đầu. Ràng buộc duy nhất theo phần tử trong D1 quyết định ai là người đầu tiên.
      security: [{ PlayerId: [] }]
      x-ac: [AC-DISC-05, AC-DISC-06, AC-DISC-07, AC-DISC-08, AC-DISC-10, AC-DISC-11, AC-DISC-12, AC-REPORT-09, AC-INV-08, AC-PRIV-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Combination' }
      responses:
        '200':
          description: Đã có người khám phá trước (`first = false`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResult' }
        '201':
          description: Người đầu tiên (`first = true`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /daily/{version}/results:
    post:
      operationId: submitDailyResult
      tags: [play]
      summary: Nộp kết quả Món đặc biệt
      description: |
        Cần phiên hợp lệ (thiếu/hết hạn → 401) và đồng ý `play` của UUID (thiếu → 403). Chỉ nhận cho version hiện
        hành (version cũ → 410). Cặp (a, b) phải là công thức đang hoạt động của version đó và ra đúng Món đặc biệt
        (sai → 422, không ghi gì). `solved_at` = thời điểm server nhận, `solve_ms` = `solved_at` − `batch_at`.
        Lưu 1 lần cho (tài khoản, version); cập nhật streak tài khoản theo ngày GMT+7 của `batch_at`. Giới hạn 10
        yêu cầu/phút theo tài khoản và theo IP băm (AC-DAILY-13); bộ đếm IP chạy trước khi tra phiên nên cookie giả
        cũng bị chặn. Thân không phải `application/json` → 415 (quy tắc CSRF của ADR 0010).
      security: [{ PlayerId: [], Session: [] }]
      x-ac: [AC-DAILY-06, AC-DAILY-07, AC-DAILY-08, AC-DAILY-10, AC-DAILY-13, AC-INV-10, AC-INV-11, AC-REPORT-09, AC-PRIV-02, AC-AUTH-02, AC-AUTH-04]
      parameters:
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyResultRequest' }
      responses:
        '201':
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Đã nộp cho version này - kèm kết quả đã lưu, không ghi đè
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [result]
                    properties:
                      result: { $ref: '#/components/schemas/DailyResult' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Problem' }
  /daily/{version}/leaderboard:
    get:
      operationId: getDailyLeaderboard
      tags: [play]
      summary: Bảng xếp hạng mẻ (top 20 cố định theo AC, không phân trang)
      description: |
        Xếp theo `solved_at` tăng dần, hòa tới ms thì theo thứ tự ghi. `value` = `solve_ms`. Phiên tùy chọn - có thì
        `me` là hạng của tài khoản kể cả ngoài top 20 (chưa nộp → null). Không có id tài khoản/UUID trong phản hồi.
        Chỉ đọc phiên, không gia hạn và không đặt lại cookie (đọc công khai, không giới hạn tần suất).
      security: [{}, { Session: [] }]
      x-ac: [AC-DAILY-09, AC-DAILY-15]
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Bảng xếp hạng (rỗng nếu chưa có kết quả)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLeaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /daily/leaderboard:
    get:
      operationId: getDailyPeriodLeaderboard
      tags: [play]
      summary: Bảng xếp hạng tuần / tháng lịch GMT+7 (top 20 cố định theo AC, không phân trang)
      description: |
        Mẻ thuộc kỳ theo ngày GMT+7 của `batch_at`. Xếp theo số mẻ đã giải giảm dần, rồi tổng `solve_ms` tăng dần,
        rồi `solved_at` của kết quả cuối cùng trong kỳ tăng dần. `period` vắng thì là tuần hiện tại; kỳ trong tương
        lai hoặc bắt đầu trước hôm nay quá 3 tháng → 400. Phiên tùy chọn - có thì kèm hạng của mình; chỉ đọc phiên,
        không gia hạn và không đặt lại cookie.
      security: [{}, { Session: [] }]
      x-ac: [AC-DAILY-14, AC-DAILY-15]
      parameters:
        - name: period
          in: query
          required: false
          description: Tuần ISO `2026-W43` hoặc tháng `2026-10`
