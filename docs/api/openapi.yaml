  # ---------------------------------------------------------------- pipeline
  /metrics/summary:
    get:
      operationId: getMetricsSummary
      tags: [pipeline]
      summary: Số liệu tổng hợp một ngày GMT+7 (không UUID, không sự kiện thô)
      security: [{ PipelineToken: [] }, { AdminToken: [] }]
      x-ac: [AC-METRIC-05, AC-METRIC-06, AC-PIPE-13]
      parameters:
        - name: day
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Số liệu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/state:
    get:
      operationId: getPipelineState
      tags: [pipeline]
      summary: Trạng thái pipeline cần cho mẻ mới
      description: |
        Chỉ dữ liệu nội dung và tổng hợp ẩn danh: version hiện hành, danh sách chặn, bí danh bị chặn
        (nguồn `mod`/`admin`), lịch sử Món đặc biệt, tỉ lệ "Nhạt" theo công thức. Không có dữ liệu người chơi.
      security: [{ PipelineToken: [] }]
      x-ac: [AC-PIPE-13, AC-DAILY-01, AC-MOD-10, AC-FEEDBACK-04, AC-INV-03]
      responses:
        '200':
          description: Trạng thái
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/store:
    get:
      operationId: getPipelineStore
      tags: [pipeline]
      summary: Kho pipeline giai đoạn 2 của version hiện hành (hoặc version chỉ định)
      description: |
        Trả nguyên `store_json` mà mẻ `full` đã ghi cùng version đó (ADR 0009). Không có `version` thì là version
        hiện hành; sau rollback là kho của version đã quay về. Version hiện hành chưa có kho (mẻ `core`, hoặc chưa
        đăng mẻ nào) → `{}`. `version` chỉ định mà không còn lưu (ngoài 14 bản) → 404. Không có dữ liệu người chơi.
      security: [{ PipelineToken: [] }]
      x-ac: [AC-PIPE-07, AC-PIPE-10, AC-PIPE-13, AC-INV-05, AC-ART-03, AC-ART-10]
      parameters:
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Kho (có thể rỗng)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/images/{key}:
    put:
      operationId: putPipelineImage
      tags: [pipeline]
      summary: Tải một ảnh minh họa đã qua kiểm duyệt lên R2 (ADR 0012)
      description: |
        Thân là ảnh WebP 256×256 đã qua kiểm duyệt (AC-ART-02, AC-ART-04). Worker kiểm `key` đúng bằng 12 ký tự hex
        đầu của SHA-256 thân và thân bắt đầu bằng chữ ký WebP (`RIFF....WEBP`), rồi ghi object `img/<key>` qua binding
        `IMG`. Khóa theo nội dung nên đã có thì không ghi lại, vẫn trả 204 (idempotent). Ảnh tải lên trước khi đăng mẻ;
        mẻ lỗi thì ảnh mồ côi vô hại (không ai tham chiếu). Không có dữ liệu người chơi.
      security: [{ PipelineToken: [] }]
      x-ac: [AC-ART-04, AC-ART-09]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{12}\.webp$' }
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary, maxLength: 524288 }
      responses:
        '204': { description: Đã lưu (hoặc đã có sẵn) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/banned-terms/{source}:
    put:
      operationId: putBannedTerms
      tags: [pipeline]
      summary: Thay toàn bộ tập từ cấm của một nguồn (wordlist từ GitHub Secret, hoặc bí danh do MOD sinh)
      security: [{ PipelineToken: [] }]
      x-ac: [AC-DISC-03, AC-MOD-06]
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [wordlist, mod] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terms]
              properties:
                terms:
                  type: array
                  maxItems: 5000
                  items: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '204': { description: Đã thay }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/batches:
    post:
      operationId: publishBatch
      tags: [pipeline]
      summary: Đăng một version mới (nguyên tử) hoặc ghi một đợt lỗi
      description: |
        `status = success`: ghi danh mục phần tử/công thức, nội dung version, chuyển `current_version` và xóa
        version ngoài 14 bản mới nhất - tất cả trong một `DB.batch` (lỗi ⇒ không đổi gì, AC-PIPE-11). Mẻ `full`
        gửi kèm `store` (ADR 0009), ghi vào `pipeline_store` trong cùng `DB.batch` và xóa cùng 14 bản; mẻ `core`
        không gửi `store`. Thân quá 5 MB, hoặc `store` dạng JSON quá 1,9 MB (D1 giới hạn 2 MB mỗi dòng) → 413.
        `version` phải lớn hơn mọi version đã đăng (409). `status = error`: chỉ ghi nhật ký đợt, không đổi bản
        đang chạy.
      security: [{ PipelineToken: [] }]
      x-ac: [AC-PIPE-01, AC-PIPE-10, AC-PIPE-11, AC-GRAPH-04, AC-GRAPH-05, AC-SEED-01, AC-SEED-08, AC-DAILY-01, AC-DAILY-02, AC-INV-06, AC-ART-09]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishBatchRequest' }
      responses:
        '201':
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/batches/{id}:
    patch:
      operationId: patchBatchRun
      tags: [pipeline]
      summary: Gắn link GitHub Issue báo cáo đợt
      security: [{ PipelineToken: [] }]
      x-ac: [AC-PIPE-14, AC-ADMIN-08]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issue_url]
              properties:
                issue_url: { type: string, format: uri, pattern: '^https://github\.com/', maxLength: 300 }
      responses:
        '200':
          description: Đã gắn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /pipeline/rollback:
    post:
      operationId: rollbackBatch
      tags: [pipeline]
      summary: Chuyển version hiện hành về bản trước (hoặc version chỉ định)
      description: Ghi một dòng nhật ký `rollback`. Không có bản trước / version không còn lưu ⇒ 409 / 404, bản hiện hành không đổi.
      security: [{ PipelineToken: [] }]
      x-ac: [AC-GRAPH-06, AC-GRAPH-07, AC-PIPE-14]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Đã chuyển
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- images (phase 2)
  /img/{key}:
    servers:
      - url: /lau-meme
    get:
      operationId: getImage
      tags: [content]
      summary: Ảnh minh họa từ R2 (giai đoạn 2)
      security: []
      x-ac: [AC-ART-05]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{12}\.webp$' }
      responses:
        '200':
          description: Ảnh WebP 256×256
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheImmutable' }
          content:
            image/webp:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    PlayerId:
      type: apiKey
      in: header
      name: X-Player-Id
      description: UUID v4 sinh bằng `crypto.randomUUID()` (định danh ẩn danh, không phải xác thực). Sai định dạng → 400.
    Session:
      type: apiKey
      in: cookie
      name: laumeme_sid
      description: |
        Mã phiên ngẫu nhiên 256 bit (base64url), D1 chỉ lưu SHA-256. Cookie `HttpOnly; Secure; SameSite=Lax;
        Path=/lau-meme`; hết hạn sau 90 ngày không dùng, mỗi lần dùng ở endpoint cần phiên gia hạn (bảng xếp hạng
        công khai chỉ đọc, không gia hạn - ADR 0010). Thiếu/hết hạn/đã thu hồi
        → 401. Yêu cầu ghi có cookie phải là `application/json` (chặn form chéo trang).
    AdminToken:
      type: http
      scheme: bearer
      description: '`ADMIN_TOKEN` (Cloudflare secret), so hằng thời gian; 5 lần sai/phút/IP băm ⇒ khóa 15 phút (429).'
    PipelineToken:
      type: http
      scheme: bearer
      description: '`PIPELINE_TOKEN` (Cloudflare secret + GitHub Secret). Chỉ mở được `/pipeline/*` và `/metrics/summary`.'

  parameters:
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    CacheShort:
      schema: { type: string, example: 'public, max-age=60' }
    CacheImmutable:
      schema: { type: string, example: 'public, max-age=31536000, immutable' }
    SetSessionCookie:
      description: '`laumeme_sid=<mã>; Path=/lau-meme; Max-Age=7776000; HttpOnly; Secure; SameSite=Lax`'
      schema: { type: string }
    ClearSessionCookie:
      description: '`laumeme_sid=; Path=/lau-meme; Max-Age=0; HttpOnly; Secure; SameSite=Lax`'
      schema: { type: string }
    RetryAfter:
      description: Số giây chờ trước khi thử lại
      schema: { type: integer, minimum: 1 }

  responses:
    Problem:
      description: Lỗi theo RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Thiếu/sai định dạng (UUID, tham số, JSON, trường lạ)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Thiếu hoặc sai token; phiên thiếu, hết hạn hoặc đã thu hồi; ID token Google không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Chưa có đồng ý cần thiết cho version chính sách hiện hành
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không tồn tại
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Xung đột trạng thái
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Mẻ đã qua
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Thân yêu cầu không phải application/json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Nội dung vượt giới hạn
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Đúng định dạng nhưng sai nghiệp vụ (công thức không có thật, nickname không hợp lệ…)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Chưa có mẻ nào được đăng
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ElementId:
      type: string
      description: base64url(SHA-256("lm1|e|" + fold(tên))) - ADR 0002
      pattern: '^[A-Za-z0-9_-]{43}$'
    RecipeId:
      type: string
      description: Khóa tra cứu của cặp không thứ tự - ADR 0002
      pattern: '^[A-Za-z0-9_-]{43}$'
    Name:
      type: string
      minLength: 1
      maxLength: 100
    TargetState:
      type: string
      enum: [active, hidden, blocked]
    Instant:
      type: string
      format: date-time
      description: ISO 8601 UTC

    Starter:
      type: object
      additionalProperties: false
      required: [id, name, emoji]
      properties:
        id: { $ref: '#/components/schemas/ElementId' }
        name: { type: string }
        emoji: { type: string }
    Manifest:
      type: object
      additionalProperties: false
      required: [version, batch_at, graph_url, starters, miss_lines, daily, policy_version]
      properties:
        version: { type: integer, minimum: 1 }
        batch_at: { $ref: '#/components/schemas/Instant' }
        graph_url:
          type: string
          description: Đường dẫn tương đối với tiền tố của game (ADR 0007) - client gọi `<tiền tố><graph_url>`, vd `/lau-meme/api/graph/12`
          example: /api/graph/12
        starters:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/Starter' }
        miss_lines:
          type: array
          minItems: 1
          items: { type: string, maxLength: 200 }
        daily:
          type: object
          additionalProperties: false
          required: [element_id, emoji, hint, depth]
          description: Không có tên món (AC-DAILY-03); client so `element_id` với id của kết quả đã giải mã
          properties:
            element_id: { $ref: '#/components/schemas/ElementId' }
            emoji: { type: string }
            hint: { type: string, maxLength: 200 }
            depth: { type: integer, minimum: 4, maximum: 8 }
        policy_version:
          type: integer
          minimum: 1
          description: Do Worker thêm (biến `POLICY_VERSION`), không thuộc nội dung pipeline
    Graph:
      type: object
      additionalProperties: false
      required: [format, version, entries]
      description: |
        `entries[lookup_key] = base64url(AES-256-GCM ciphertext+tag)`; khóa và IV dẫn xuất từ 2 tên đầu vào
        (ADR 0002). Bản rõ là `GraphResult`.
      properties:
        format: { type: integer, enum: [1] }
        version: { type: integer, minimum: 1 }
        entries:
          type: object
          propertyNames: { pattern: '^[A-Za-z0-9_-]{43}$' }
          additionalProperties: { type: string }
    GraphResult:
      type: object
      description: Bản rõ sau khi giải mã một mục (chỉ có trên client)
      required: [id, name, emoji, depth, added_version]
      properties:
        id: { $ref: '#/components/schemas/ElementId' }
        name: { type: string }
        emoji: { type: string }
        depth: { type: integer, minimum: 1 }
        added_version: { type: integer }
        image_key: { type: [string, 'null'], pattern: '^[0-9a-f]{12}\.webp$' }
    Blocklist:
      type: object
      additionalProperties: false
      required: [elements, recipes, images]
      properties:
        elements: { type: array, items: { $ref: '#/components/schemas/ElementId' } }
        recipes: { type: array, items: { $ref: '#/components/schemas/RecipeId' } }
        images:
          type: array
          description: Id phần tử có ảnh bị chặn
          items: { $ref: '#/components/schemas/ElementId' }

    ConsentRequest:
      type: object
      additionalProperties: false
      required: [purpose, action, policy_version]
      properties:
        purpose: { type: string, enum: [play, nickname] }
        action: { type: string, enum: [grant, withdraw] }
        policy_version: { type: integer, minimum: 1, description: Phải bằng version hiện hành (khác → 422) }
    Consent:
      type: object
      additionalProperties: false
      required: [purpose, action, policy_version, created_at]
      properties:
        purpose: { type: string, enum: [play, nickname, all] }
        action: { type: string, enum: [grant, withdraw, erase] }
        policy_version: { type: integer }
        created_at: { $ref: '#/components/schemas/Instant' }
    NicknameRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          maxLength: 100
          description: Sau khi cắt khoảng trắng phải dài 2–20, chỉ chữ (có dấu), số, khoảng trắng, `_`, `-` (sai → 422)
    Streak:
      type: object
      additionalProperties: false
      required: [current, longest]
      properties:
        current: { type: integer, minimum: 0 }
        longest: { type: integer, minimum: 0 }
    GoogleSignInRequest:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential: { type: string, maxLength: 4096, description: ID token (JWT) từ Google Identity Services }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [nickname, created_at]
      properties:
        nickname: { type: [string, 'null'], description: 'Nickname của tài khoản; null → client hiện "Thực khách ẩn danh"' }
        created_at: { $ref: '#/components/schemas/Instant' }
    MyData:
      type: object
      additionalProperties: false
      required: [nickname, discoveries, daily_results, streak, reports, votes, consents, event_counts, account]
      properties:
        nickname: { type: [string, 'null'] }
        account:
          description: Chỉ khi có phiên hợp lệ; không có băm `sub`
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [created_at, open_sessions, nickname, daily_results, streak]
              properties:
                created_at: { $ref: '#/components/schemas/Instant' }
                open_sessions: { type: integer, minimum: 1 }
                nickname: { type: [string, 'null'] }
                daily_results:
                  type: array
                  items: { $ref: '#/components/schemas/DailyResult' }
                streak: { $ref: '#/components/schemas/Streak' }
        discoveries:
          type: array
          items:
            type: object
            required: [element_id, discovered_at]
            properties:
              element_id: { $ref: '#/components/schemas/ElementId' }
              discovered_at: { $ref: '#/components/schemas/Instant' }
        daily_results:
          type: array
          items: { $ref: '#/components/schemas/DailyResult' }
        streak: { $ref: '#/components/schemas/Streak' }
        reports:
          type: array
          items:
            type: object
            required: [target, id, reason, created_at]
            properties:
              target: { type: string, enum: [element, image] }
              id: { $ref: '#/components/schemas/ElementId' }
              reason: { $ref: '#/components/schemas/ReportReason' }
              created_at: { $ref: '#/components/schemas/Instant' }
        votes:
          type: array
          items: { $ref: '#/components/schemas/Vote' }
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
        event_counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }

    Combination:
      type: object
      additionalProperties: false
      required: [a, b, result]
      properties:
        a: { $ref: '#/components/schemas/Name' }
        b: { $ref: '#/components/schemas/Name' }
        result: { $ref: '#/components/schemas/Name' }
    Discovery:
      type: object
      additionalProperties: false
      required: [element_id, nickname, discovered_at]
      properties:
        element_id: { $ref: '#/components/schemas/ElementId' }
        nickname: { type: string, description: '"Thực khách ẩn danh" khi không có nickname hoặc đã xóa' }
        discovered_at: { $ref: '#/components/schemas/Instant' }
    DiscoveryResult:
      allOf:
        - $ref: '#/components/schemas/Discovery'
        - type: object
          required: [first]
          properties:
            first: { type: boolean }
    DailyResultRequest:
      type: object
      additionalProperties: false
      required: [a, b]
      properties:
        a: { $ref: '#/components/schemas/Name' }
        b: { $ref: '#/components/schemas/Name' }
    DailyResult:
      type: object
      additionalProperties: false
      required: [version, solve_ms, rank, streak, solved_at]
      properties:
        version: { type: integer }
        solve_ms: { type: integer, minimum: 0, description: '`solved_at` − `batch_at` của mẻ' }
        rank: { type: integer, minimum: 1, description: Hạng hiện tại trong mẻ }
        streak: { $ref: '#/components/schemas/Streak' }
        solved_at: { $ref: '#/components/schemas/Instant' }
    LeaderboardRow:
      type: object
      additionalProperties: false
      required: [rank, nickname, value]
      properties:
        rank: { type: integer, minimum: 1 }
        nickname: { type: string }
        value: { type: integer, description: Thời gian giải tính bằng ms (bảng mẻ) hoặc streak hiện tại }
    DailyLeaderboard:
      type: object
      additionalProperties: false
      required: [version, rows, me]
      properties:
        version: { type: integer }
        rows:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LeaderboardRow' }
        me:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LeaderboardRow'
    PeriodLeaderboardRow:
      type: object
      additionalProperties: false
      required: [rank, nickname, solved, total_ms]
      properties:
        rank: { type: integer, minimum: 1 }
        nickname: { type: string }
        solved: { type: integer, minimum: 1, description: Số mẻ đã giải trong kỳ }
        total_ms: { type: integer, minimum: 0, description: Tổng thời gian giải các mẻ đã giải }
    PeriodLeaderboard:
      type: object
      additionalProperties: false
      required: [period, starts_at, ends_at, batches, rows, me]
      properties:
        period: { type: string, examples: ['2026-W43', '2026-10'] }
        starts_at: { $ref: '#/components/schemas/Instant' }
        ends_at: { $ref: '#/components/schemas/Instant' }
        batches: { type: integer, minimum: 0, description: Số mẻ trong kỳ (tới hiện tại) }
        rows:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PeriodLeaderboardRow' }
        me:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PeriodLeaderboardRow'
    StreakLeaderboard:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LeaderboardRow' }
    ReportReason:
      type: string
      enum: [real_person, politics_religion, sexual, discrimination, violence_drugs_selfharm, inappropriate_image, other]
    ReportRequest:
      type: object
      additionalProperties: false
      required: [target, id, reason]
      properties:
        target: { type: string, enum: [element, image] }
        id: { $ref: '#/components/schemas/ElementId' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        note: { type: string, maxLength: 1000, description: 'Chỉ với `other` (lý do khác kèm note → 422); 201–1000 ký tự → 422, dài hơn 1000 → 400' }
    Report:
      type: object
      additionalProperties: false
      required: [target, id, reason, status, created_at]
      properties:
        target: { type: string, enum: [element, image] }
        id: { $ref: '#/components/schemas/ElementId' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        status: { type: string, enum: [new, resolved_hidden, resolved_shown, resolved_dismissed] }
        created_at: { $ref: '#/components/schemas/Instant' }
    VoteRequest:
      type: object
      additionalProperties: false
      required: [a, b, value]
      properties:
        a: { $ref: '#/components/schemas/Name' }
        b: { $ref: '#/components/schemas/Name' }
        value: { type: string, maxLength: 10, description: '`ngon` hoặc `nhat` (khác → 422)' }
    Vote:
      type: object
      additionalProperties: false
      required: [recipe_id, value, updated_at]
      properties:
        recipe_id: { $ref: '#/components/schemas/RecipeId' }
        value: { type: string, enum: [ngon, nhat] }
        updated_at: { $ref: '#/components/schemas/Instant' }

    EventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        player_id:
          type: string
          format: uuid
          description: Chỉ dùng khi gửi bằng `sendBeacon` (không có header `X-Player-Id`)
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/Event' }
    Event:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: session_start }
        - type: object
          additionalProperties: false
          required: [type, ok, miss]
          properties:
            type: { const: combine_summary }
            ok: { type: integer, minimum: 0, maximum: 10000 }
            miss: { type: integer, minimum: 0, maximum: 10000 }
        - type: object
          additionalProperties: false
          required: [type, version]
          properties:
            type: { const: daily_start }
            version: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [type, version, steps]
          properties:
            type: { const: daily_complete }
            version: { type: integer, minimum: 1 }
            steps: { type: integer, minimum: 1, maximum: 200 }
        - type: object
          additionalProperties: false
          required: [type, card, method]
          properties:
            type: { const: share }
            card: { type: string, enum: [daily, discovery] }
            method: { type: string, enum: [copy, native, image] }
        - type: object
          additionalProperties: false
          required: [type, target]
          properties:
            type: { const: report }
            target: { type: string, enum: [element, image] }
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type: { const: feedback }
            value: { type: string, enum: [ngon, nhat] }

    Page:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    ReportSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [target, id, name, emoji, reporters, reasons, last_reported_at, state]
                properties:
                  target: { type: string, enum: [element, image] }
                  id: { $ref: '#/components/schemas/ElementId' }
                  name: { type: string }
                  emoji: { type: string }
                  reporters: { type: integer, description: Số UUID khác nhau trong chu kỳ đếm }
                  reasons:
                    type: object
                    propertyNames: { $ref: '#/components/schemas/ReportReason' }
                    additionalProperties: { type: integer }
                  last_reported_at: { $ref: '#/components/schemas/Instant' }
                  state: { $ref: '#/components/schemas/TargetState' }
    AdminElementPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, name, emoji, depth, state, image_state, last_version]
                properties:
                  id: { $ref: '#/components/schemas/ElementId' }
                  name: { type: string }
                  emoji: { type: string }
                  depth: { type: integer }
                  state: { $ref: '#/components/schemas/TargetState' }
                  image_key: { type: [string, 'null'] }
                  image_state: { type: string, enum: [none, active, hidden] }
                  last_version: { type: integer }
    AdminRecipePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, a, b, result, state]
                properties:
                  id: { $ref: '#/components/schemas/RecipeId' }
                  a: { $ref: '#/components/schemas/Starter' }
                  b: { $ref: '#/components/schemas/Starter' }
                  result: { $ref: '#/components/schemas/Starter' }
                  state: { type: string, enum: [active, hidden] }
    ModerationRequest:
      type: object
      additionalProperties: false
      required: [target_kind, target_id, action]
      properties:
        target_kind: { type: string, enum: [element, recipe, image] }
        target_id: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'Id phần tử (element, image) hoặc id công thức' }
        action: { type: string, enum: [hide, show, block, unblock, dismiss_reports], description: '`block`/`unblock` chỉ cho element' }
        reason: { type: string, maxLength: 200 }
    ModerationResult:
      type: object
      additionalProperties: false
      required: [target_kind, target_id, before, after]
      properties:
        target_kind: { type: string, enum: [element, recipe, image] }
        target_id: { type: string }
        before: { $ref: '#/components/schemas/TargetState' }
        after: { $ref: '#/components/schemas/TargetState' }
    BatchRun:
      type: object
      additionalProperties: false
      required: [id, version, batch_at, mode, status, stats, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: [integer, 'null'] }
        batch_at: { $ref: '#/components/schemas/Instant' }
        mode: { type: string, enum: [core, full] }
        status: { type: string, enum: [success, error, rollback] }
        failed_step: { type: [string, 'null'] }
        rollback_to: { type: [integer, 'null'] }
        stats: { $ref: '#/components/schemas/BatchStats' }
        issue_url: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Instant' }
    BatchStats:
      type: object
      additionalProperties: false
      properties:
        crawled: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        blocked:
          type: object
          description: Số bị chặn theo danh mục
          additionalProperties: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        source_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source, error]
            properties:
              source: { type: string, maxLength: 50 }
              error: { type: string, maxLength: 200 }
        quota_used: { type: integer, minimum: 0 }
    BatchPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BatchRun' }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [action, target_kind, target_id, before, after, token_fp, created_at]
                properties:
                  action: { type: string, enum: [hide, show, block, unblock, dismiss_reports] }
                  target_kind: { type: string, enum: [element, recipe, image] }
                  target_id: { type: string }
                  before: { $ref: '#/components/schemas/TargetState' }
                  after: { $ref: '#/components/schemas/TargetState' }
                  reason: { type: [string, 'null'] }
                  token_fp: { type: string, pattern: '^[0-9a-f]{8}$' }
                  created_at: { $ref: '#/components/schemas/Instant' }

    MetricsSummary:
      type: object
      additionalProperties: false
      required: [day, daily_players, daily_completions, d1_retention, d7_retention, shares, miss_rate, nhat_rate, reports]
      properties:
        day: { type: string, format: date }
        daily_players: { type: integer, minimum: 0 }
        daily_completions: { type: integer, minimum: 0 }
        d1_retention: { type: [number, 'null'], minimum: 0, maximum: 1 }
        d7_retention: { type: [number, 'null'], minimum: 0, maximum: 1 }
        shares:
          type: object
          additionalProperties: false
          required: [daily, discovery]
          properties:
            daily: { type: integer, minimum: 0 }
            discovery: { type: integer, minimum: 0 }
        miss_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        nhat_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reports: { type: integer, minimum: 0 }
    PipelineState:
      type: object
      additionalProperties: false
      required: [current_version, blocklist, banned_aliases, admin_blocked, daily_history, feedback]
      properties:
        current_version: { type: [integer, 'null'] }
        blocklist: { $ref: '#/components/schemas/Blocklist' }
        banned_aliases:
          type: array
          description: '`fold` do MOD sinh hoặc quản trị chặn (không gồm wordlist - pipeline đã có từ secret)'
          items: { type: string }
        admin_blocked:
          type: array
          description: Chỉ `fold` do quản trị chặn (nguồn `admin`), để báo cáo đợt đếm "đã bị chặn" (AC-MOD-10, ADR 0009)
          items: { type: string }
        daily_history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [version, element_id, batch_at]
            properties:
              version: { type: integer }
              element_id: { $ref: '#/components/schemas/ElementId' }
              batch_at: { $ref: '#/components/schemas/Instant' }
        feedback:
          type: array
          description: Tổng hợp ẩn danh theo công thức (không UUID)
          items:
            type: object
            additionalProperties: false
            required: [recipe_id, votes, nhat]
            properties:
              recipe_id: { $ref: '#/components/schemas/RecipeId' }
              votes: { type: integer, minimum: 0 }
              nhat: { type: integer, minimum: 0 }

    PipelineStore:
      type: object
      description: |
        Kho pipeline giai đoạn 2 (ADR 0009). Worker chỉ lưu và trả lại, không đọc trường bên trong; chỉ pipeline
        hiểu chi tiết. Chỉ dữ liệu meme công khai, không có dữ liệu người chơi (AC-PIPE-13).
      additionalProperties: false
      properties:
        elements:
          type: array
          description: Phần tử trend (id, tên, emoji, mô tả, gợi ý, `hint_ok`, `image_hint_ok`, `held_until`, nguồn, `added_version`, `depth`; với ART thêm `image_key`, `art_attempts` (đợt lỗi tạm thời, tối đa 3) và `image_fallback` (giữ emoji) - AC-ART-09/10)
          items: { type: object }
        recipes:
          type: array
          description: Công thức trend và bổ sung (id, a, b, result, score)
          items: { type: object }
        queue:
          type: array
          description: Meme chưa nối được hoặc dừng vì hết quota (khái niệm, `attempts`, `reason`)
          items: { type: object }
        asked_pairs:
          type: array
          description: Cặp đã hỏi LLM và bị loại, không hỏi lại (AC-PIPE-08)
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
        llm_cache:
          type: object
          description: Phản hồi LLM của mẻ ghi, khóa = sha256(bước + payload) (AC-PIPE-10)
          additionalProperties: true
        art_pending:
          type: array
          description: Id phần tử "chờ vẽ" (hết hạn mức hoặc vượt 20 ảnh/đợt), đợt sau vẽ trước phần tử mới (AC-ART-03)
          items: { $ref: '#/components/schemas/ElementId' }
    PublishBatchRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, version, batch_at, mode, manifest, graph, content, stats]
          properties:
            status: { const: success }
            version: { type: integer, minimum: 1 }
            batch_at: { $ref: '#/components/schemas/Instant' }
            mode: { type: string, enum: [core, full] }
            manifest:
              description: Manifest không có `policy_version` (Worker tự thêm)
              type: object
            graph: { $ref: '#/components/schemas/Graph' }
            content: { $ref: '#/components/schemas/BatchContent' }
            stats: { $ref: '#/components/schemas/BatchStats' }
            store: { $ref: '#/components/schemas/PipelineStore' }
        - type: object
          additionalProperties: false
          required: [status, batch_at, mode, failed_step, stats]
          properties:
            status: { const: error }
            batch_at: { $ref: '#/components/schemas/Instant' }
            mode: { type: string, enum: [core, full] }
            failed_step: { type: string, maxLength: 100 }
            stats: { $ref: '#/components/schemas/BatchStats' }
    BatchContent:
      type: object
      additionalProperties: false
      required: [elements, recipes, starters, daily_element_id]
      description: Nội dung đang hoạt động của version (Worker dùng để kiểm DISC/DAILY và cập nhật danh mục)
      properties:
        elements:
          type: array
          maxItems: 20000
          items:
            type: object
            additionalProperties: false
            required: [id, name, fold, emoji, depth]
            properties:
              id: { $ref: '#/components/schemas/ElementId' }
              name: { type: string, maxLength: 100 }
              fold: { type: string, maxLength: 100 }
              emoji: { type: string, maxLength: 16 }
              depth: { type: integer, minimum: 0 }
              origin: { type: string, enum: [vn, intl] }
              image_key: { type: [string, 'null'], pattern: '^[0-9a-f]{12}\.webp$' }
        recipes:
          type: array
          maxItems: 50000
          items:
            type: object
            additionalProperties: false
            required: [id, a, b, result]
            properties:
              id: { $ref: '#/components/schemas/RecipeId' }
              a: { $ref: '#/components/schemas/ElementId' }
              b: { $ref: '#/components/schemas/ElementId' }
              result: { $ref: '#/components/schemas/ElementId' }
              score: { type: integer, minimum: 1, maximum: 5 }
        starters:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/ElementId' }
        daily_element_id: { $ref: '#/components/schemas/ElementId' }
