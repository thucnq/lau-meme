<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ƯỚC LƯỢNG - LẨU MEME</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1d1f23;--muted:#6b6f78;--line:#e3e1dc;--soft:#efeee9;
  --weekend:#f1efea;--holiday:#fbe9e4;--accent:#2f5bd3;
  --done:#2e8b57;--doing:#2f5bd3;--todo:#9aa0aa;--late:#d1453b;--base:#c9c6bf;
  --row:34px;--left:380px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518;--panel:#1c1e22;--ink:#e8e8ea;--muted:#9a9ea7;--line:#2c2f35;--soft:#23262b;
  --weekend:#1f2125;--holiday:#3a2522;--accent:#7c9cff;
  --done:#4fb07a;--doing:#6f8fff;--todo:#6d727c;--late:#ef6b60;--base:#4a4d54;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 8px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi.warn b{color:var(--late)}
.meter{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--done)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 24px 12px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select,.toolbar button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.toolbar button{cursor:pointer}
.toolbar button.on{border-color:var(--accent);color:var(--accent)}
.toolbar .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar .primary:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.spacer{flex:1}
.note{margin:0 24px 10px;padding:8px 12px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:12.5px;display:none}
.note.show{display:block}
.wrap{display:grid;grid-template-columns:var(--left) 1fr;margin:0 24px 24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.left{border-right:1px solid var(--line)}
.right{overflow-x:auto;position:relative}
.hdr{height:52px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.left .hdr{display:grid;grid-template-columns:1fr 58px 64px;align-items:end;padding:0 12px 6px;color:var(--muted);font-size:12px}
.row{height:var(--row);display:flex;align-items:center;border-bottom:1px solid var(--soft)}
.left .row{display:grid;grid-template-columns:22px 1fr 58px 64px;gap:6px;padding:0 12px;cursor:pointer}
.left .row:hover,.left .row.sel{background:var(--soft)}
.left .row.mod{display:flex}
.left .mod{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-left:12px;background:var(--bg)}
.right .mod{background:var(--bg)}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.who{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.s-done{background:var(--done)}.s-doing{background:var(--doing)}.s-todo{background:var(--todo)}.s-late{background:var(--late)}
.cb{width:16px;height:16px;accent-color:var(--done);margin:0}
.grid{position:relative;min-width:100%}
.timehdr{position:relative;height:52px}
.timehdr .m{position:absolute;top:6px;font-size:12px;font-weight:600;white-space:nowrap;padding-left:4px;border-left:1px solid var(--line);height:20px}
.timehdr .d{position:absolute;top:30px;font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.col{position:absolute;top:0;bottom:0}
.col.we{background:var(--weekend)}.col.ho{background:var(--holiday)}
.col.wk{border-left:1px solid var(--soft)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--late);z-index:5;opacity:.8}
.today::after{content:"Hôm nay";position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--late);white-space:nowrap}
.bars{position:relative}
.bar{position:absolute;height:16px;line-height:14px;top:9px;border-radius:5px;background:color-mix(in srgb,var(--c) 28%,transparent);border:1px solid var(--c);overflow:hidden;z-index:3;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.bar span{position:relative;font-size:10.5px;padding:0 5px;line-height:14px;white-space:nowrap;color:var(--ink)}
.base{position:absolute;height:4px;top:27px;border-radius:2px;background:var(--base);z-index:2}
.ms{position:absolute;top:10px;width:14px;height:14px;transform:rotate(45deg);background:var(--accent);z-index:3}
.detail{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);padding:16px 18px;overflow:auto;z-index:40;transform:translateX(105%);transition:transform .18s ease}
.detail.open{transform:none}
.detail .x{position:absolute;top:10px;right:12px;font:inherit;font-size:18px;background:none;border:none;color:var(--muted);cursor:pointer}
.detail h3{margin:0 0 4px;font-size:14px}
.detail .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.fields label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.fields input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.acs{list-style:none;margin:6px 0 0;padding:0}
.acs li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:12.5px}
.acs code{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tag{font-size:10.5px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--done);border-color:var(--done)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none;max-width:320px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:0 24px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:760px){:root{--left:190px}.left .row{grid-template-columns:18px 1fr 44px}.left .hdr{grid-template-columns:1fr 44px}.who,.left .hdr .h-who{display:none}header,.toolbar{padding-left:12px;padding-right:12px}.wrap,.legend,.note{margin-left:8px;margin-right:8px}}
@media print{.toolbar,.note{display:none}.wrap{border:none}}
</style>
</head>

<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="Tìm hạng mục, AC, người…" aria-label="Tìm">

</div>
<div class="tip" id="tip"></div>

    bar.innerHTML = `<i style="width:${v.pct}%"></i><span>${zoom >= 6 ? esc(v.id) + ' · ' : ''}${v.pct}%</span>`;
    bar.addEventListener('mousemove', e => tip(e, v)); bar.addEventListener('mouseleave', () => $('#tip').style.display = 'none');
    bar.addEventListener('click', () => { open = open === v.id ? null : v.id; render(); });
    br.append(bar); B.append(br);
  }
  const dr = $('#drawer'); const ov = open && DATA.items.find(i => i.id === open);
  if (ov) { dr.replaceChildren(...detail(view(ov)).childNodes); dr.classList.add('open'); } else dr.classList.remove('open');
  // hand-over section
  L.append(el('div', 'row mod', 'Bàn giao')); B.append(el('div', 'row mod'));
  const u = el('div', 'row'); u.innerHTML = `<span></span><span class="nm">UAT ${M.uatWeeks} tuần + nghiệm thu</span><span class="who"></span><span class="pc">${fmt(M.fcUat[1]).slice(0, 5)}</span>`; L.append(u);
  const ub = el('div', 'row'); ub.style.position = 'relative';
  if (showBase) { const b = el('div', 'base'); b.style.left = x(M.khUat[0]) + 'px'; b.style.width = w(M.khUat[0], M.khUat[1]) + 'px'; ub.append(b); }
  const bar = el('div', 'bar'); bar.style.setProperty('--c', 'var(--accent)'); bar.style.left = x(M.fcUat[0]) + 'px'; bar.style.width = w(M.fcUat[0], M.fcUat[1]) + 'px'; bar.innerHTML = '<span>UAT</span>'; ub.append(bar);
  const ms = el('div', 'ms'); ms.style.left = (x(M.fcUat[1]) + zoom) + 'px'; ms.title = 'Nghiệm thu dự báo ' + fmt(M.fcUat[1]); ub.append(ms);
  B.append(ub);
  columns(bg);
}

function tip(e, v) {
  const t = $('#tip'), tested = v.acs.filter(a => a.tested).length;
  t.innerHTML = `<b>${esc(v.id)} ${esc(v.name)}</b><br>${SV[v.status]} · ${v.pct}% · ${v.points}đ (${v.days} ngày công) · rủi ro ${esc(v.risk)}` +
    `<br>KH: ${fmt(v.kh[0])} → ${fmt(v.kh[1])}<br>Dự báo: ${fmt(v.fc[0])} → ${fmt(v.fc[1])}${v.slip ? ` <b style="color:var(--late)">(+${v.slip} ngày)</b>` : ''}` +
    (v.acs.length ? `<br>AC: ${v.acs.filter(a => a.done).length}/${v.acs.length} xong · ${tested}/${v.acs.length} có test` : '') +
    (v.deps.length ? `<br>Phụ thuộc: ${esc(v.deps.join(', '))}` : '') + (v.note ? `<br>Ghi chú: ${esc(v.note)}` : '');
  t.style.display = 'block';
  t.style.left = Math.min(e.clientX + 14, innerWidth - 340) + 'px'; t.style.top = (e.clientY + 14) + 'px';
}

function detail(v) {
  const d = el('div');
  d.innerHTML = `<button class="x" aria-label="Đóng">×</button><h3>${esc(v.id)} · ${esc(v.name)}</h3>` +
    `<div class="meta">${esc(v.module)} · ${v.points}đ · ${v.days} ngày công · rủi ro ${esc(v.risk)} · KH ${fmt(v.kh[0])}→${fmt(v.kh[1])} · dự báo ${fmt(v.fc[0])}→${fmt(v.fc[1])}${v.deps.length ? ' · phụ thuộc ' + esc(v.deps.join(', ')) : ''}</div>` +
    `<div class="fields">` +
    `<label>Tiến độ (%)<input type="number" min="0" max="100" step="5" data-k="pct" value="${v.pct}"></label>` +
    `<label>Người làm<input data-k="owner" value="${esc(v.owner)}" placeholder="${esc(v.lane || '')}"></label>` +
    `<label>Bắt đầu thực tế<input type="date" data-k="startActual" value="${esc(v.startActual)}"></label>` +
    `<label>Xong thực tế<input type="date" data-k="finishActual" value="${esc(v.finishActual)}"></label>` +
    `<label style="grid-column:1/-1">Ghi chú<input data-k="note" value="${esc(v.note)}"></label></div>` +
    (v.acs.length ? `<b style="font-size:12.5px">Tiêu chí nghiệm thu (${v.acs.filter(a => a.done).length}/${v.acs.length})</b><ul class="acs">` +
      v.acs.map(a => `<li><input type="checkbox" class="cb" data-ac="${esc(a.id)}" ${a.done ? 'checked' : ''}><code>${esc(a.id)}</code><span style="flex:1">${esc(a.title)}${a.optional ? ' <i class="tag">tùy chọn</i>' : ''}</span>${a.tested ? '<i class="tag ok">có test</i>' : '<i class="tag">chưa có test</i>'}</li>`).join('') + '</ul>'
      : '<div class="meta">Chưa gắn tiêu chí nghiệm thu (thêm "ac" cho hạng mục trong items.json).</div>');
  d.querySelector('.x').addEventListener('click', () => { open = null; render(); });
  d.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('change', () => {
    const k = i.dataset.k; let val = i.value;
    if (k === 'pct') { val = Math.max(0, Math.min(100, parseInt(val || '0', 10))); setItem(v.id, { pct: val, checked: val >= 100 }); }
    else setItem(v.id, { [k]: val.replace(/ · /g, ', ') });
  }));
  d.querySelectorAll('input[data-ac]').forEach(i => i.addEventListener('change', () => {
    const orig = v.acs.find(a => a.id === i.dataset.ac);
    const base = DATA.items.find(x => x.id === v.id).acs.find(a => a.id === orig.id).done;
    if (i.checked === base) delete store.acs[orig.id]; else store.acs[orig.id] = i.checked;
    save(); render();
  }));
  return d;
}

function setItem(id, patch) {
  const base = DATA.items.find(i => i.id === id);
  const cur = Object.assign({}, store.items[id] || {}, patch);
  for (const k of Object.keys(cur)) {
    const b = k === 'checked' ? base.pct >= 100 : base[k];
    if (cur[k] === b || (cur[k] === '' && !b)) delete cur[k];
  }
  if (Object.keys(cur).length) store.items[id] = cur; else delete store.items[id];
  save(); render();
}

// ---------- export the edited checklist in the exact format gen-plan.py reads
function exportMd() {
  const md = DATA.md.slice();
  for (const it of DATA.items) {
    const v = view(it), clean = s => String(s || '').replace(/ · /g, ', ');
    md[it.line] = `- [${v.pct >= 100 ? 'x' : ' '}] **${it.id}** ${it.name} · ${it.points}đ · rủi ro: ${it.risk} · KH: ${it.kh[0]} → ${it.kh[1]}` +
      ` · tiến độ: ${v.pct}%${it.pctAuto && (store.items[it.id] || {}).pct == null && v.pct < 100 ? ' (theo AC)' : ''} · người: ${clean(v.owner)} · bắt đầu: ${clean(v.startActual)} · xong: ${clean(v.finishActual)} · ghi chú: ${clean(v.note)}`;
    for (const a of v.acs) md[a.line] = md[a.line].replace(/^(\s+- \[)[ xX](\])/, `$1${a.done ? 'x' : ' '}$2`);
  }
  const blob = new Blob([md.join('\n') + '\n'], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tien-do.md'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#dl').addEventListener('click', exportMd);
$('#reset').addEventListener('click', () => { if (!dirty() || confirm('Bỏ mọi thay đổi chưa tải về?')) { store = { items: {}, acs: {} }; save(); render(); } });
['#q', '#fStatus', '#fModule', '#fOwner'].forEach(s => $(s).addEventListener('input', render));
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.seg button').forEach(o => o.classList.toggle('on', o === b)); zoom = +b.dataset.z; render();
}));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) { open = null; render(); } });
$('#tBase').addEventListener('click', e => { showBase = !showBase; e.target.classList.toggle('on', showBase); render(); });
render();
const R = $('#R'); R.scrollLeft = Math.max(0, x(M.today < M.start ? M.start : M.today) - 120);
})();
</script>
